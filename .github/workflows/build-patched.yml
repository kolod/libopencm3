name: Build (patched)

on:
  push:
    branches:
      - patched
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - patched
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            pkg-config

      - name: Configure
        run: meson setup build --cross-file cross-files/arm-none-eabi.ini

      - name: Build
        run: meson compile -C build